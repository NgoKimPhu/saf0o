name: Quality and package checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, compile, and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev libusb-1.0-0-dev
      - run: pnpm run setup:ci
      - run: pnpm run audit:release
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run compile
      - run: pnpm test
      - run: pnpm run test:e2e
      - run: pnpm run test:usbAdapters
      - name: Upload integration results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipfs-integration-${{ github.sha }}
          path: |
            compiled/*-integration-report.json
            compiled/simulation-fallback-e2e.json
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: Build Linux packages
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev libusb-1.0-0-dev
      - run: pnpm run setup:ci
      - run: pnpm run compile
      - run: pnpm run bundle
      - run: pnpm run package:linux:x64
      - run: pnpm run package:verify:linux
      - name: Generate CycloneDX SBOM
        run: pnpm run sbom:linux
      - name: Verify production SBOM
        run: pnpm run sbom:verify:linux
      - name: Finalize and verify release checksums
        run: |
          pnpm run checksums:linux
          pnpm run release:verify:linux
      - name: Upload package smoke-test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wren-linux-x64-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*_amd64.deb
            dist/SHA256SUMS
            dist/wren.cdx.json
          if-no-files-found: error
          retention-days: 7

  package-native-smoke:
    name: ${{ matrix.name }} package smoke
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            csc_for_pull_request: false
            package-command: pnpm run package:linux:arm64
            verify-command: pnpm run package:verify:linux:arm64
            artifact-name: wren-linux-arm64
            artifact-path: |
              dist/*.AppImage
              dist/*.tar.gz
          - name: macOS x64 ad-hoc preview
            runner: macos-15-intel
            csc_for_pull_request: true
            package-command: pnpm run package:mac:preview:x64
            verify-command: pnpm run package:verify:mac:x64
            artifact-name: wren-macos-x64
            artifact-path: |
              dist/*.dmg
              dist/*.zip
          - name: macOS arm64 ad-hoc preview
            runner: macos-15
            csc_for_pull_request: true
            package-command: pnpm run package:mac:preview:arm64
            verify-command: pnpm run package:verify:mac:arm64
            artifact-name: wren-macos-arm64
            artifact-path: |
              dist/*.dmg
              dist/*.zip
          - name: Windows x64
            runner: windows-2022
            csc_for_pull_request: false
            package-command: pnpm run package:windows:unsigned:x64
            verify-command: pnpm run package:verify:windows:x64
            artifact-name: wren-windows-x64
            artifact-path: dist/*.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev libusb-1.0-0-dev
      - run: pnpm run setup:ci
      - run: pnpm run compile
      - run: pnpm run bundle
      - name: Build native smoke package
        env:
          CSC_FOR_PULL_REQUEST: ${{ matrix.csc_for_pull_request }}
        run: ${{ matrix.package-command }}
      - name: Verify native package and archive payloads
        run: ${{ matrix.verify-command }}
      - name: Upload unqualified smoke artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}-unqualified
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
